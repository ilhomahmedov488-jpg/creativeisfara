<div id="creative-phone-access" class="viz-dotted-background">
  <style>
    #creative-phone-access{padding:20px 10px;display:flex;align-items:center;flex-direction:column;gap:14px;background:transparent;box-sizing:border-box}
    #creative-phone-access *{box-sizing:border-box}
    #creative-phone-access .cm-preview{width:100%;max-width:410px}
    #creative-phone-access .cm-phone{--cm-paper:#faf7f1;--cm-card:#fffdf8;--cm-ink:#292924;--cm-soft:#706b63;--cm-bronze:#89603d;--cm-line:#e2dbcf;--cm-tile:#eee7dc;--cm-green:#436047;--cm-green-bg:#e6ede2;--cm-orange:#815b26;--cm-orange-bg:#f4e8d1;--cm-red:#8b4339;--cm-red-bg:#f5e7e2;width:100%;max-width:410px;height:760px;position:relative;transform:translateZ(0);isolation:isolate;border-radius:28px;border:1px solid #d9d0c3;background:var(--cm-paper);color:var(--cm-ink);overflow:hidden;box-shadow:0 14px 45px #30251916;font:400 14px/1.5 Arial,sans-serif;--cm-top:101px;--cm-bottom:78px;color-scheme:light}
    #creative-phone-access .cm-phone button,#creative-phone-access .cm-phone input,#creative-phone-access .cm-phone select,#creative-phone-access .cm-phone textarea{font:inherit;color:inherit}
    #creative-phone-access .cm-phone button,#creative-phone-access .cm-phone a{touch-action:manipulation}
    #creative-phone-access .cm-header{position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 18px 0;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--cm-paper);border-bottom:1px solid var(--cm-line)}
    #creative-phone-access .cm-header-main{display:flex;justify-content:space-between;align-items:center;gap:12px}
    #creative-phone-access .cm-logo{display:block;width:118px;height:44px;object-fit:contain}
    #creative-phone-access .cm-lang{display:flex;gap:2px;border:1px solid var(--cm-line);border-radius:22px;padding:2px}
    #creative-phone-access .cm-lang button{background:transparent;border:0;border-radius:20px;min-height:38px;min-width:38px;font-size:11px}
    #creative-phone-access .cm-lang button[aria-pressed=true]{background:var(--cm-ink);color:var(--cm-card)}
    #creative-phone-access .cm-demo{font-size:11px;color:var(--cm-soft);display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--cm-line);padding:7px 0;margin-top:7px}
    #creative-phone-access .cm-demo b{font-weight:500;color:var(--cm-bronze);letter-spacing:.7px}
    #creative-phone-access .cm-main{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding-top:var(--cm-top);padding-bottom:var(--cm-bottom);scroll-padding-top:calc(var(--cm-top) + 12px);scroll-padding-bottom:calc(var(--cm-bottom) + 12px)}
    #creative-phone-access .cm-page{padding:23px 18px 27px;min-width:0}
    #creative-phone-access .cm-footer{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 5px 12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--cm-card);border-top:1px solid var(--cm-line)}
    #creative-phone-access .cm-footer button{min-height:52px;min-width:0;border:0;background:transparent;display:flex;align-items:center;flex-direction:column;gap:5px;font-size:11px;color:var(--cm-soft);border-radius:12px;padding:7px 1px 4px}
    #creative-phone-access .cm-footer button[aria-pressed=true]{background:var(--cm-tile);color:var(--cm-ink)}
    #creative-phone-access .cm-phone svg{width:19px;height:19px;stroke-width:1.6;flex-shrink:0}
    #creative-phone-access .cm-eyebrow{font-size:11px;color:var(--cm-bronze);letter-spacing:.8px;margin-bottom:6px}
    #creative-phone-access h2{font:400 29px/1.14 Georgia,serif;letter-spacing:-.5px;margin:0 0 9px;overflow-wrap:anywhere}
    #creative-phone-access h3{font:400 22px/1.2 Georgia,serif;margin:0 0 13px}
    #creative-phone-access h4{font-size:14px;font-weight:500;margin:0 0 6px}
    #creative-phone-access p{margin:0 0 14px}
    #creative-phone-access .cm-sub{font-size:12px;color:var(--cm-soft);line-height:1.65;margin-bottom:20px}
    #creative-phone-access .cm-topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}
    #creative-phone-access .cm-topline h3{margin:0}
    #creative-phone-access .cm-topline button{border:0;background:transparent;font-size:12px;color:var(--cm-bronze);min-height:44px;padding:6px}
    #creative-phone-access .cm-card{border:1px solid var(--cm-line);border-radius:17px;background:var(--cm-card);padding:16px;margin-bottom:12px;min-width:0}
    #creative-phone-access .cm-feature{background:var(--cm-tile);border-color:var(--cm-tile)}
    #creative-phone-access .cm-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
    #creative-phone-access .cm-card-head strong{font-size:15px;font-weight:500;display:block;overflow-wrap:anywhere}
    #creative-phone-access .cm-id{font-size:11px;color:var(--cm-soft);margin-top:3px}
    #creative-phone-access .cm-badge{display:inline-block;font-size:11px;line-height:1.4;border-radius:20px;padding:5px 8px;background:var(--cm-tile);color:var(--cm-soft);max-width:140px;text-align:center}
    #creative-phone-access .cm-badge.is-confirmed,#creative-phone-access .cm-badge.is-ready{background:var(--cm-green-bg);color:var(--cm-green)}
    #creative-phone-access .cm-badge.is-new{background:var(--cm-orange-bg);color:var(--cm-orange)}
    #creative-phone-access .cm-badge.is-editing{background:var(--cm-tile);color:var(--cm-bronze)}
    #creative-phone-access .cm-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;font-size:12px}
    #creative-phone-access .cm-row>span{color:var(--cm-soft);min-width:0}
    #creative-phone-access .cm-row strong{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
    #creative-phone-access .cm-row+ .cm-row{border-top:1px solid var(--cm-line)}
    #creative-phone-access .cm-button{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:46px;padding:11px 13px;border:1px solid var(--cm-line);border-radius:11px;background:var(--cm-card);font-size:12px!important;text-decoration:none;text-align:center}
    #creative-phone-access .cm-primary{background:var(--cm-ink);border-color:var(--cm-ink);color:var(--cm-card)!important}
    #creative-phone-access .cm-wide{width:100%}
    #creative-phone-access .cm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
    #creative-phone-access .cm-actions>*{flex:1;min-width:100px}
    #creative-phone-access .cm-money{font-size:31px;line-height:1.15;font-weight:400;letter-spacing:-.7px;margin:5px 0 15px;font-variant-numeric:tabular-nums}
    #creative-phone-access .cm-money small{font-size:12px;letter-spacing:0}
    #creative-phone-access .cm-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
    #creative-phone-access .cm-stat{border:1px solid var(--cm-line);background:var(--cm-card);border-radius:14px;padding:13px 12px;min-width:0;text-align:left}
    #creative-phone-access .cm-stat b{display:block;font-size:27px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums}
    #creative-phone-access .cm-stat span{display:block;font-size:11px;margin-top:7px;color:var(--cm-soft)}
    #creative-phone-access .cm-note{display:flex;gap:10px;font-size:12px;line-height:1.65;padding:14px 0;color:var(--cm-soft)}
    #creative-phone-access .cm-note svg{color:var(--cm-bronze);margin-top:2px}
    #creative-phone-access .cm-linkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:13px 0;border:0;border-bottom:1px solid var(--cm-line);width:100%;background:transparent;text-align:left;font-size:13px!important;text-decoration:none;color:inherit}
    #creative-phone-access .cm-linkrow>span{display:flex;align-items:center;gap:11px;min-width:0}
    #creative-phone-access .cm-linkrow small{font-size:11px;color:var(--cm-soft);text-align:right;max-width:110px}
    #creative-phone-access .cm-back{border:0;background:transparent;font-size:12px!important;color:var(--cm-bronze)!important;min-height:44px;padding:0 3px;margin-bottom:10px}
    #creative-phone-access .cm-field{display:block;font-size:12px;margin:0 0 16px}
    #creative-phone-access .cm-field input,#creative-phone-access .cm-field select,#creative-phone-access .cm-field textarea{display:block;width:100%;min-width:0;margin-top:7px;min-height:47px;padding:11px;border:1px solid var(--cm-line);border-radius:10px;background:var(--cm-card);font-size:16px;line-height:1.4}
    #creative-phone-access .cm-field textarea{min-height:82px;resize:vertical}
    #creative-phone-access .cm-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    #creative-phone-access .cm-field small{font-size:11px;line-height:1.6;display:block;margin-top:6px;color:var(--cm-soft)}
    #creative-phone-access .cm-check{display:flex;align-items:center;gap:11px;padding:12px 0;min-height:50px;border-bottom:1px solid var(--cm-line);font-size:12px}
    #creative-phone-access .cm-check input{width:20px;height:20px;flex-shrink:0;accent-color:var(--cm-bronze)}
    #creative-phone-access .cm-check>span{flex:1;min-width:0}
    #creative-phone-access .cm-check small{display:block;font-size:11px;color:var(--cm-soft);margin-top:3px}
    #creative-phone-access .cm-check b{font-size:12px;font-weight:500;white-space:nowrap}
    #creative-phone-access .cm-tabs{display:flex;gap:3px;border-radius:12px;background:var(--cm-tile);padding:4px;margin:17px 0 21px}
    #creative-phone-access .cm-tabs button{flex:1;min-width:0;min-height:43px;padding:9px 2px;border:0;background:transparent;border-radius:9px;font-size:12px}
    #creative-phone-access .cm-tabs button[aria-pressed=true]{background:var(--cm-card);box-shadow:0 1px 4px #30251910}
    #creative-phone-access .cm-filter{margin:20px 0 14px}
    #creative-phone-access .cm-error{font-size:12px;color:var(--cm-red);line-height:1.6;margin:10px 0}
    #creative-phone-access .cm-empty{text-align:center;color:var(--cm-soft);font-size:13px;padding:35px 14px}
    #creative-phone-access .cm-empty svg{display:block;width:28px;height:28px;margin:0 auto 13px}
    #creative-phone-access .cm-person{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--cm-line);padding:13px 0}
    #creative-phone-access .cm-avatar{display:grid;place-items:center;width:41px;height:41px;flex-shrink:0;background:var(--cm-tile);color:var(--cm-bronze);border-radius:50%;font-size:13px}
    #creative-phone-access .cm-person strong{font-size:13px;font-weight:500;display:block;overflow-wrap:anywhere}
    #creative-phone-access .cm-person small{display:block;font-size:11px;color:var(--cm-soft);margin-top:3px}
    #creative-phone-access .cm-person-copy{min-width:0;flex:1}
    #creative-phone-access .cm-person input{width:20px;height:20px;flex-shrink:0;accent-color:var(--cm-bronze)}
    #creative-phone-access .cm-avatar img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
    #creative-phone-access .cm-profile-head{display:flex;align-items:center;gap:14px;margin:5px 0 21px}
    #creative-phone-access .cm-profile-head .cm-avatar{width:68px;height:68px;font-size:22px}
    #creative-phone-access .cm-profile-head h3{margin:0 0 5px;font-size:23px}
    #creative-phone-access .cm-profile-head p{font-size:12px;color:var(--cm-soft);margin:0}
    #creative-phone-access .cm-staff-date{font:400 23px/1.2 Georgia,serif;margin:5px 0 15px}
    #creative-phone-access .cm-reel{width:100%;max-width:190px;aspect-ratio:9/16;object-fit:contain;margin:10px auto 17px}
    #creative-phone-access .cm-author{font-size:11px;color:var(--cm-soft);margin:8px 0 0}
    #creative-phone-access .cm-profile-bio{white-space:pre-wrap;overflow-wrap:anywhere}
    #creative-phone-access .cm-staff-role{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--cm-bronze);margin:0 0 18px}
    #creative-phone-access .cm-staff-role svg{width:15px;height:15px}
    #creative-phone-access .cm-person.is-busy{background:var(--cm-tile);border-radius:11px;padding-left:9px;padding-right:9px;margin-top:4px}
    #creative-phone-access .cm-person .cm-availability-free{color:var(--cm-green)}
    #creative-phone-access .cm-person .cm-availability-busy{color:var(--cm-red)}
    #creative-phone-access .cm-person input:disabled{cursor:not-allowed}
    #creative-phone-access .cm-crew-count{font-size:12px;color:var(--cm-soft);margin:15px 0 8px}
    #creative-phone-access .cm-day{padding-bottom:18px;min-height:49px}
    #creative-phone-access .cm-day-count{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:11px;line-height:1;color:var(--cm-bronze)}
    #creative-phone-access .cm-day[aria-pressed=true] .cm-day-count{color:var(--cm-card)}
    #creative-phone-access .cm-log{list-style:none;padding:0;margin:0}
    #creative-phone-access .cm-log li{padding:13px 0;border-bottom:1px solid var(--cm-line);font-size:12px}
    #creative-phone-access .cm-log small{display:block;color:var(--cm-soft);font-size:11px;margin-top:5px}
    #creative-phone-access .cm-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0 13px}
    #creative-phone-access .cm-calendar-head strong{font-weight:500;font-size:14px}
    #creative-phone-access .cm-calendar-head button{min-height:44px;border:0;background:transparent;padding:6px;font-size:11px}
    #creative-phone-access .cm-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 0 17px}
    #creative-phone-access .cm-dayname{text-align:center;font-size:11px;color:var(--cm-soft);padding:6px 0}
    #creative-phone-access .cm-day{position:relative;min-width:0;min-height:43px;padding:6px 1px 11px;border:0;border-radius:9px;background:var(--cm-card);font-size:12px!important}
    #creative-phone-access .cm-day[aria-pressed=true]{background:var(--cm-ink);color:var(--cm-card)}
    #creative-phone-access .cm-day.is-today{box-shadow:inset 0 0 0 1px var(--cm-bronze)}
    #creative-phone-access .cm-day .cm-dot{position:absolute;width:4px;height:4px;bottom:5px;left:calc(50% - 2px);border-radius:50%;background:var(--cm-bronze)}
    #creative-phone-access .cm-day[aria-pressed=true] .cm-dot{background:var(--cm-card)}
    #creative-phone-access .cm-calendar-count{font-size:12px;color:var(--cm-soft);margin-bottom:17px}
    #creative-phone-access .cm-media-placeholder{min-height:180px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--cm-bronze);text-align:center;background:var(--cm-tile);border-radius:14px;font-size:12px;padding:25px;margin:15px 0}
    #creative-phone-access .cm-media-placeholder svg{width:32px;height:32px;stroke-width:1.2}
    #creative-phone-access video{display:block;width:100%;max-height:320px;background:var(--cm-ink);border-radius:12px;margin:15px 0}
    #creative-phone-access .cm-toast{position:fixed;z-index:40;left:14px;right:14px;bottom:calc(var(--cm-bottom) + 10px);border:1px solid var(--cm-line);border-radius:13px;padding:12px 14px;background:var(--cm-ink);color:var(--cm-card);font-size:12px;box-shadow:0 4px 20px #29292425;pointer-events:none}
    #creative-phone-access .cm-toast:empty{display:none}
    #creative-phone-access .cm-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:350px){#creative-phone-access{padding:12px 0}#creative-phone-access .cm-phone{border-radius:20px}#creative-phone-access .cm-page{padding-left:14px;padding-right:14px}#creative-phone-access .cm-header{padding-left:14px;padding-right:14px}#creative-phone-access .cm-calendar{gap:2px}#creative-phone-access .cm-day{min-height:44px}#creative-phone-access .cm-badge{max-width:116px}}
    @media(prefers-reduced-motion:no-preference){#creative-phone-access .cm-button{transition:background .16s ease}#creative-phone-access .cm-footer button{transition:background .16s ease}}
  </style>

    function orderCard(o){return `<article class="cm-card"><div class="cm-card-head"><div><strong>${esc(o.client)}</strong><div class="cm-id">${o.id} · ${eventName(o)}</div></div>${statusBadge(o)}</div>${row(t().date,dateLabel(o.date))}${row(t().start,o.time||t().noTime)}${row(t().total,`${money(o.total)} ${t().somoni}`)}${row(t().crew,o.crew.length?o.crew.map(id=>team.find(p=>p.id===id)?.name||id).map(esc).join(', '):t().noCrew)}${o.request?`<div class="cm-note">${ico('calendar-clock')}<span>${t().requestPending}</span></div>`:''}<div class="cm-actions">${btn(t().openOrder,`data-order="${o.id}"`)}${btn(t().assignCrew,`data-order-crew="${o.id}"`)}</div></article>`;}
    function home(){
      const newOrders=orders.filter(o=>o.status==='new');
      const next=orders.filter(o=>o.status==='confirmed'&&o.date>=demoToday).sort((a,b)=>a.date.localeCompare(b.date))[0];
      const stats=`<div class="cm-stat-grid"><button type="button" class="cm-stat cursor-interaction" data-filter-link="new"><b>${newOrders.length}</b><span>${t().newRequests}</span></button><button type="button" class="cm-stat cursor-interaction" data-filter-link="editing"><b>${orders.filter(o=>o.status==='editing').length}</b><span>${t().inEditing}</span></button></div>`;
      return heading(account==='owner'?t().hello:t().adminHello,account==='owner'?t().ownerSub:t().adminSub,account==='owner'?t().owner:t().admin)+`<div class="cm-sub">${t().period}</div>`+(account==='owner'?summary()+stats:stats+(newOrders[0]?orderCard(newOrders[0]):''))+`<div class="cm-topline"><h3>${t().nextShoot}</h3><button type="button" class="cursor-interaction" data-view="calendar">${t().nav[2]}</button></div>`+(next?orderCard(next):empty(t().empty))+`<div class="cm-note">${ico('bell')}<span>${t().nextNote}</span></div><div class="cm-topline"><h3>${t().quick}</h3></div>${link(t().manageMedia,'media','film')}${link(t().manageTeam,'team','users')}${link(t().manageFinance,'finance','wallet')}`;
    }
    function list(){const chosen=orders.filter(o=>filter==='all'||o.status===filter);return heading(t().orders,t().ordersSub)+`<label class="cm-field cm-filter">${t().filter}<select id="cm-order-filter">${['all','new','confirmed','editing','ready'].map(k=>`<option value="${k}" ${filter===k?'selected':''}>${t()[k]}</option>`).join('')}</select></label>`+chosen.map(orderCard).join('')+(chosen.length?'':empty(t().empty));}
    function getOrder(){return orders.find(o=>o.id===orderId);}
    function makeDraft(o){return {date:o.date,weddingTime:o.weddingTime,time:o.time,plan:o.plan,extras:{...o.extras},cameras:o.cameras||1,rates:{...o.rates},crew:[...o.crew]};}
    function busyOrders(personId,date,excludeId=''){return orders.filter(o=>o.id!==excludeId&&o.status!=='cancelled'&&o.date===date&&o.crew.includes(personId));}
    function crewConflicts(ids,date,excludeId){return ids.map(id=>({id,orders:busyOrders(id,date,excludeId)})).filter(item=>item.orders.length);}
    function conflictText(conflicts){return t().crewConflict+': '+conflicts.map(c=>(team.find(p=>p.id===c.id)?.name||c.id)+' ('+c.orders.map(o=>o.id).join(', ')+')').join('; ')+'. '+t().crewReassignHint;}
    function daySummary(date,excludeId=''){const day=orders.filter(o=>o.date===date&&o.status!=='cancelled'),available=team.filter(p=>!busyOrders(p.id,date,excludeId).length).length;return `<div class="cm-card cm-feature">${row(t().dayOrders,String(day.length))}${row(t().dayWeddings,String(day.filter(o=>o.event==='wedding').length))}${row(t().crewFreeCount,`${available} / ${team.length}`)}</div>`;}
    function calculate(d,o){const r=d.rates||o.rates||rates;if(o.event==='love')return r.love;if(o.event==='foteha')return d.cameras===2?r.fotehaTwo:r.fotehaOne;return r[packageKeys[d.plan]]+(d.extras.love?r.love:0)+(d.extras.screen?r.screen:0)+(d.plan===2?0:(d.extras.album?r.album:0)+(d.extras.foteha===2?r.fotehaTwo:d.extras.foteha===1?r.fotehaOne:0));}
    function shootTime(d,o){if(o.event!=='wedding')return d.time;if(d.plan===2)return '12:00';if(!/^\d{2}:\d{2}$/.test(d.weddingTime))return '';const [h,m]=d.weddingTime.split(':').map(Number),minutes=h*60+m-360;if(minutes<0)return '';return String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(minutes%60).padStart(2,'0');}
    function checkbox(key,label,price,checked,disabled=false){return `<label class="cm-check"><input type="checkbox" data-extra="${key}" ${checked?'checked':''} ${disabled?'disabled':''} class="cursor-interaction"><span>${label}${disabled?`<small>${t().included}</small>`:''}</span><b>${price}</b></label>`;}
    function extras(d,o){if(o.event!=='wedding')return '';const premium=d.plan===2,r=d.rates||o.rates;return `<h3>${t().extras}</h3>${checkbox('foteha',t().cameraOne,premium?'':money(d.extras.foteha===2?r.fotehaTwo:r.fotehaOne),premium||d.extras.foteha>0,premium)}${!premium&&d.extras.foteha>0?`<label class="cm-field">${t().fotehaCameras}<select id="cm-extra-cameras">${[1,2].map(n=>`<option value="${n}" ${d.extras.foteha===n?'selected':''}>${t().cams[n-1]}</option>`).join('')}</select></label>`:''}${checkbox('love',t().loveExtra,money(r.love),d.extras.love)}${checkbox('album',t().album,premium?'':money(r.album),premium||d.extras.album,premium)}${checkbox('screen',t().screen,money(r.screen),d.extras.screen)}${d.extras.love?`<div class="cm-note">${ico('info')}<span>${t().variableLove}</span></div>`:''}`;}
    function detailForm(o){const d=draft||makeDraft(o);return `<form id="cm-details-form"><div class="cm-card">${row(t().client,esc(o.client))}${row(t().phone,t().phoneMissing)}${row(t().status,t()[o.status])}</div><label class="cm-field">${t().date}<input type="date" id="cm-order-date" required value="${d.date}"></label>${o.event==='wedding'?`<label class="cm-field">${t().plan}<select id="cm-order-plan">${t().planNames.map((p,i)=>`<option value="${i}" ${d.plan===i?'selected':''}>${p} · ${money(d.rates[packageKeys[i]])}</option>`).join('')}</select></label><label class="cm-field">${t().weddingStart}<input type="time" id="cm-wedding-time" value="${d.weddingTime}" required><small>${t().timeHint}</small></label><div class="cm-card">${row(t().start,`<span id="cm-calculated-start" aria-live="polite">${shootTime(d,o)||t().noTime}</span>`)}</div>`:`${o.event==='foteha'?`<label class="cm-field">${t().fotehaCameras}<select id="cm-service-cameras">${[1,2].map(n=>`<option value="${n}" ${d.cameras===n?'selected':''}>${t().cams[n-1]}</option>`).join('')}</select></label>`:''}<label class="cm-field">${t().start}<input type="time" id="cm-order-time" value="${d.time}" required><small>${t().startHint}</small></label>`}${extras(d,o)}<div id="cm-order-quote" class="cm-card cm-feature" aria-live="polite" style="margin-top:19px">${row(t().total,`${money(calculate(d,o))} ${t().somoni}`)}${row(t().deposit,`${money(calculate(d,o)*.2)} ${t().somoni}`)}</div><p class="cm-sub">${t().transport}</p><div id="cm-detail-error" class="cm-error" role="alert"></div><button type="submit" class="cm-button cm-wide cursor-interaction">${t().save}</button></form>`;}
    function paymentForm(o){return `<div class="cm-topline"><h3>${t().payment}</h3></div><div class="cm-card">${row(t().total,`${money(o.total)} ${t().somoni}`)}${row(t().paid,`${money(o.paid)} ${t().somoni}`)}${row(t().balance,`${money(o.total-o.paid)} ${t().somoni}`)}<form id="cm-payment-form" style="margin-top:15px"><label class="cm-field">${t().paidField}<input id="cm-paid" type="number" min="0" max="${o.total}" step="1" required value="${o.paid}"><small>${t().paymentHint}</small></label><div id="cm-payment-error" class="cm-error" role="alert"></div><button type="submit" class="cm-button cm-wide cursor-interaction">${t().save}</button></form></div>`;}
    function orderActions(o){const keys={new:['confirm','confirm'],confirmed:['editing','startEditing'],editing:['ready','markReady']};const k=keys[o.status];return k?`<div class="cm-actions">${btn(t()[k[1]],`data-transition="${k[0]}"`,true)}</div>${o.status==='new'?`<p class="cm-sub" style="margin-top:11px">${t().confirmHint}</p>`:''}`:`<div class="cm-note">${ico('circle-check')}<span>${t().alreadyReady}</span></div>`;}
    function changeRequest(o){return o.request?`<div class="cm-card cm-feature"><h4>${t().request}</h4>${row(t().requestedDate,dateLabel(o.request))}<p class="cm-sub" style="margin:12px 0 0">${t().requestNote}</p><div id="cm-request-error" class="cm-error" role="alert"></div><div class="cm-actions">${btn(t().approve,'data-request="approve"',true)}${btn(t().decline,'data-request="decline"')}${btn(t().crewForNewDate,'data-reschedule-crew')}</div></div>`:'';}
    function crewForm(o){const d=draft||makeDraft(o),date=d.date,selected=d.crew,available=team.filter(p=>!busyOrders(p.id,date,o.id).length).length,dateChanged=date!==o.date,requestChanged=dateChanged&&date===o.request;return `<div class="cm-eyebrow">${t().crewDate}</div><h3>${date?dateLabel(date):t().crewDateRequired}</h3>${daySummary(date,o.id)}<p class="cm-sub">${t().crewRule}</p>${dateChanged?`<div class="cm-note">${ico('calendar-clock')}<span>${requestChanged?t().crewRequestNote:t().crewDateNote}</span></div>`:''}<button type="button" class="cm-button cm-wide cursor-interaction" data-show-day="${date}">${t().dayShow}</button><div id="cm-crew-count" class="cm-crew-count" role="status" aria-live="polite">${t().crewSelected}: ${selected.length} · ${t().crewFreeCount}: ${available}</div>${available?'':`<p class="cm-error">${t().crewNoneFree}</p>`}<form id="cm-crew-form">${team.map(p=>{const other=busyOrders(p.id,date,o.id),busy=other.length>0,checked=selected.includes(p.id);return `<label class="cm-person${busy?' is-busy':''}"><span class="cm-avatar">${p.name.split(' ').map(n=>n[0]).join('')}</span><span class="cm-person-copy"><strong>${p.name}</strong><small>${t()[p.role]}</small><small class="${busy?'cm-availability-busy':'cm-availability-free'}">${busy?t().crewBusy+' · '+other.map(x=>x.id+' · '+esc(x.client)).join('; '):o.crew.includes(p.id)?t().crewAssigned:t().crewFree}</small></span><input type="checkbox" class="cursor-interaction" name="crew" value="${p.id}" ${checked?'checked':''} ${busy&&!checked?'disabled':''} aria-label="${esc(p.name)} · ${busy?t().crewBusy:t().crewFree}"></label>`;}).join('')}<div id="cm-crew-error" class="cm-error" role="alert"></div><button type="submit" class="cm-button cm-primary cm-wide cursor-interaction" style="margin-top:20px">${requestChanged?t().crewSaveRequest:dateChanged?t().crewSaveDate:t().save}</button><p class="cm-sub" style="margin:13px 0 0">${t().crewReserveNote}</p></form>`;}
    function dayBefore(date){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10);}
    function communication(o){let sms='';if(o.status==='new')sms=empty(t().noMessages,'message-square');else if(o.status==='ready')sms=`<div class="cm-card"><h4>${t().readySMS}</h4><p class="cm-sub">${t().smsExample}</p><p>${t().smsReady}</p></div>`;else if(o.status==='confirmed')sms=`<div class="cm-card"><h4>${t().reminder}</h4><div class="cm-id">${dateLabel(dayBefore(o.date))} · ${t().scheduled}</div><p style="margin-top:14px">${t().smsTomorrow} ${o.time}.</p><small class="cm-sub">${t().smsExample}</small></div>`;return sms+`<div class="cm-topline"><h3>${t().history}</h3></div><ul class="cm-log">${o.history.slice().reverse().map(h=>`<li>${t()[h.key]}<small>${dateLabel(h.date)}${h.who?' · '+(h.who==='owner'?t().byOwner:t().byAdmin):''}</small></li>`).join('')}</ul>`;}
    function orderDetail(){const o=getOrder();if(!o)return list();return back('orders')+heading(esc(o.client),'',`${o.id} · ${eventName(o)}`)+statusBadge(o)+`<div class="cm-tabs" aria-label="${t().details}">${['details','crew','messages'].map(k=>`<button type="button" class="cursor-interaction" data-order-tab="${k}" aria-pressed="${orderTab===k}">${t()[k]}</button>`).join('')}</div>`+(orderTab==='crew'?crewForm(o):orderTab==='messages'?communication(o):changeRequest(o)+detailForm(o)+orderActions(o)+paymentForm(o)+(o.status==='ready'?`<div class="cm-note">${ico('package')}<span>${t().pickupNote}</span></div>`:''));}
    function calendar(){const count=new Date(Date.UTC(year,month+1,0)).getUTCDate(),offset=(new Date(Date.UTC(year,month,1)).getUTCDay()+6)%7;let days=t().weekdays.map(s=>`<div class="cm-dayname">${s}</div>`).join('')+Array(offset).fill('<span></span>').join('');for(let i=1;i<=count;i++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,booked=orders.filter(o=>o.date===date&&o.status!=='cancelled');days+=`<button type="button" class="cm-day cursor-interaction${date===demoToday?' is-today':''}" data-date="${date}" aria-pressed="${selectedDate===date}" aria-label="${esc(dateLabel(date))}${booked.length?' · '+booked.length+' '+t().nav[1]:''}">${i}${booked.length?'<span class="cm-day-count" aria-hidden="true">'+booked.length+'</span>':''}</button>`;}const chosen=orders.filter(o=>o.date===selectedDate&&o.status!=='cancelled');return heading(t().calendar,t().calendarSub)+`<div class="cm-calendar-head"><button type="button" class="cursor-interaction" data-month="-1">${t().prev}</button><strong>${t().months[month]} ${year}</strong><button type="button" class="cursor-interaction" data-month="1">${t().next}</button></div><div class="cm-calendar" role="group" aria-label="${t().calendar}">${days}</div><p class="cm-calendar-count">${t().requestDateNote}</p><h3>${dateLabel(selectedDate)}</h3>${daySummary(selectedDate)}`+(chosen.length?chosen.map(orderCard).join(''):empty(t().noDateOrders,'calendar-days'));}
    function media(){const items=visibleMedia();return heading(isManager()?t().video:t().myVideos,isManager()?t().videoSub:t().myVideosSub)+`<div class="cm-note">${ico('circle-check')}<span>${t().noModeration}</span></div><h3>${mediaEditId?t().mediaEdit:t().mediaAdd}</h3><form id="cm-media-form"><label class="cm-field">${t().videoTitle}<input id="cm-video-title" type="text" maxlength="100" required value="${esc(mediaDraft.title)}"></label><div class="cm-fields"><label class="cm-field">${t().videoEvent}<select id="cm-video-event">${['wedding','love','foteha'].map(k=>`<option value="${k}" ${mediaDraft.event===k?'selected':''}>${t()[k]}</option>`).join('')}</select></label><label class="cm-field">${t().placement}<select id="cm-video-placement"><option value="reels" ${mediaDraft.placement!=='portfolio'?'selected':''}>Reels</option><option value="portfolio" ${mediaDraft.placement==='portfolio'?'selected':''}>${t().portfolio}</option></select></label></div><label class="cm-field">${t().videoFile}<input id="cm-video-file" type="file" accept="video/*"><small>${mediaDraft.filename?esc(mediaDraft.filename):t().videoFileHint}</small></label>${mediaDraft.url?`<video class="${mediaDraft.placement!=='portfolio'?'cm-reel':''}" src="${esc(mediaDraft.url)}" controls playsinline preload="metadata"></video>`:''}<label class="cm-check"><input type="checkbox" id="cm-video-rights" class="cursor-interaction" ${mediaDraft.authorized?'checked':''}><span>${t().rights}</span></label><div id="cm-media-error" class="cm-error" role="alert"></div><button type="submit" class="cm-button cm-primary cm-wide cursor-interaction" style="margin-top:16px">${mediaEditId?t().mediaSave:t().publish}</button>${mediaEditId?`<button type="button" class="cm-button cm-wide cursor-interaction" data-media-cancel style="margin-top:8px">${t().mediaCancel}</button>`:''}</form><div class="cm-topline"><h3>${isManager()?t().video:t().myVideos}</h3></div>`+(items.length?items.map(v=>`<article class="cm-card"><video class="${v.placement==='reels'?'cm-reel':''}" src="${esc(v.url)}" controls playsinline preload="metadata"></video><h4>${esc(v.title)}</h4><div class="cm-id">${t()[v.event]} · ${v.placement==='portfolio'?t().portfolio:'Reels'} · ${t().published}</div><p class="cm-author">${t().mediaAuthor}: ${esc(team.find(p=>p.id===v.author)?.name||'')}</p><div class="cm-actions">${btn(t().priceEdit,`data-media-edit="${v.id}"`)}${btn(t().mediaDelete,`data-media-delete="${v.id}"`)}</div></article>`).join(''):`<div class="cm-media-placeholder">${ico('clapperboard')}<span>${isManager()?t().videoEmpty:t().myVideoEmpty}</span></div>`);}
    function more(){return heading(t().profile)+`<div class="cm-person" style="padding-top:5px"><div class="cm-avatar">${account==='owner'?'ИА':'АХ'}</div><div class="cm-person-copy"><strong>${account==='owner'?t().byOwner:t().byAdmin}</strong><small>${t().fullAccess} · ${t().separateAccount}</small><small>${esc(phoneBindings[currentPerson().id]||t().phoneNotBound)}</small></div></div><div class="cm-note">${ico('shield-check')}<span>${t().sameAccess}</span></div>${link(t().phoneAccess,'phoneAccess','smartphone')}${link(t().finance,'finance','wallet')}${link(t().team,'team','users')}${link(t().prices,'prices','tags')}${link(t().notifications,'notifications','bell')}<button type="button" class="cm-linkrow cursor-interaction" data-demo-exit><span>${ico('log-out')}${t().logout}</span></button>`;}
    function financePage(){const f=finance();return back()+heading(t().finance,t().financeSub)+summary()+`<p class="cm-sub">${t().financeNote}</p>`+f.orders.map(o=>`<article class="cm-card"><div class="cm-card-head"><div><strong>${esc(o.client)}</strong><div class="cm-id">${o.id}</div></div>${statusBadge(o)}</div>${row(t().total,money(o.total))}${row(t().paid,money(o.paid))}${row(t().balance,money(o.total-o.paid))}<button type="button" class="cm-button cm-wide cursor-interaction" data-order="${o.id}" style="margin-top:12px">${t().payment}</button></article>`).join('');}
    function teamPage(){return back()+heading(t().team,t().teamSub)+link(t().phoneAccess,'phoneAccess','smartphone')+team.map(p=>`<div class="cm-person"><div class="cm-avatar">${profiles[p.id].url?`<img src="${esc(profiles[p.id].url)}" alt="${esc(p.name)}">`:p.name.split(' ').map(s=>s[0]).join('')}</div><div class="cm-person-copy"><strong>${p.name}</strong><small>${t()[p.role]}</small><small>${p.id==='ilhom'?t().ownerAccess:p.id==='abdu'?t().adminAccess:t().staffAccess}</small><small>${esc(phoneBindings[p.id]||t().phoneNotBound)}</small>${profiles[p.id].bio?`<small class="cm-profile-bio">${esc(profiles[p.id].bio)}</small>`:''}</div></div>`).join('')+`<div class="cm-note">${ico('shield-check')}<span>${t().permissionNote}</span></div>`;}
    function priceLabels(){return {standard:t().planNames[0],pro:t().planNames[1],premium:t().planNames[2],fotehaOne:t().cameraOne,fotehaTwo:t().cameraTwo,love:t().loveExtra,album:t().album,screen:t().screen};}
    function pricesDirty(){return priceKeys.some(k=>priceDraft[k]!==String(rates[k]));}
    function priceInput(k){const labels=priceLabels(),index=packageKeys.indexOf(k);return `<label class="cm-field">${labels[k]}<input type="number" min="1" step="1" inputmode="numeric" id="cm-price-${k}" data-price="${k}" required value="${esc(priceDraft[k])}" aria-describedby="cm-price-currency">${index>=0?`<small>${t().priceCrew[index]}${index===2?' · '+t().premiumGift:''}</small>`:''}</label>`;}
    function clientPrices(){return `<p class="cm-sub">${t().pricePreviewNote}</p>`+packageKeys.map((k,i)=>`<div class="cm-card${i===2?' cm-feature':''}"><div class="cm-card-head"><strong>${t().planNames[i]}</strong><strong>${money(rates[k])} <small>${t().somoni}</small></strong></div><p class="cm-sub" style="margin:0">${t().priceCrew[i]}</p>${i===2?`<p class="cm-sub" style="margin:10px 0 0">${t().premiumGift}</p>`:''}</div>`).join('')+`<h3 style="margin-top:24px">${t().extras}</h3>`+priceKeys.filter(k=>!packageKeys.includes(k)).map(k=>row(priceLabels()[k],`${money(rates[k])} ${t().somoni}`)).join('')+`<div class="cm-note">${ico('info')}<span>${t().transport}</span></div>`;}
    function pricesPage(){const dirty=pricesDirty();return back()+heading(t().prices,t().priceSub)+`<div class="cm-tabs" aria-label="${t().prices}">${['edit','preview'].map(k=>`<button type="button" class="cursor-interaction" data-price-mode="${k}" aria-pressed="${priceMode===k}">${k==='edit'?t().priceEdit:t().pricePreview}</button>`).join('')}</div>`+(priceMode==='preview'?clientPrices():`<div class="cm-note" style="padding-top:0">${ico('lock-keyhole')}<span>${t().pricePolicy}</span></div><div class="cm-tabs" aria-label="${t().priceEdit}">${['packages','extras'].map(k=>`<button type="button" class="cursor-interaction" data-price-section="${k}" aria-pressed="${priceSection===k}">${k==='packages'?t().pricePackages:t().priceExtras}</button>`).join('')}</div><form id="cm-prices-form" novalidate><div id="cm-price-currency" class="cm-eyebrow">${t().priceCurrency}</div>${(priceSection==='packages'?packageKeys:priceKeys.filter(k=>!packageKeys.includes(k))).map(priceInput).join('')}<div id="cm-price-dirty" class="cm-sub" role="status" aria-live="polite" style="margin-bottom:10px">${dirty?t().priceDirty:t().priceClean}</div><div id="cm-prices-error" class="cm-error" role="alert"></div><div class="cm-actions"><button type="submit" class="cm-button cm-primary cursor-interaction">${t().priceSave}</button><button type="button" class="cm-button cursor-interaction" data-price-reset ${dirty?'':'disabled'}>${t().priceCancel}</button></div><p class="cm-sub" style="margin:13px 0 0">${t().priceDemo}</p>${priceUpdatedBy?`<div class="cm-id">${t().priceUpdated}: ${priceUpdatedBy==='owner'?t().byOwner:t().byAdmin} · DEMO</div>`:''}</form>`);}
    function notifications(){return back()+heading(t().notifications,t().notificationSub)+`<div class="cm-card"><h4>Payom.tj</h4><span class="cm-badge">${t().notConnected}</span><div style="margin-top:13px">${row(t().smsLogin,'SMS')}${row(t().dayBefore,'SMS')}${row(t().whenReady,'SMS')}</div></div><div class="cm-card"><h4>WhatsApp · Telegram</h4><p class="cm-sub">${t().adminChannel}</p><span class="cm-badge">${t().notConnected}</span></div><div class="cm-note">${ico('info')}<span>${t().notificationNote}</span></div>`;}

    function staffCalendar(){const mine=ownShoots().filter(o=>o.status!=='cancelled'),count=new Date(Date.UTC(year,month+1,0)).getUTCDate(),offset=(new Date(Date.UTC(year,month,1)).getUTCDay()+6)%7;let days=t().weekdays.map(s=>`<div class="cm-dayname">${s}</div>`).join('')+Array(offset).fill('<span></span>').join('');for(let i=1;i<=count;i++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,booked=mine.filter(o=>o.date===date);days+=`<button type="button" class="cm-day cursor-interaction${date===demoToday?' is-today':''}" data-date="${date}" aria-pressed="${selectedDate===date}" aria-label="${esc(dateLabel(date))}${booked.length?' · '+t().myShoots+': '+booked.length:''}">${i}${booked.length?`<span class="cm-day-count" aria-hidden="true">${booked.length}</span>`:''}</button>`;}const chosen=mine.filter(o=>o.date===selectedDate);return heading(t().nav[2],t().staffCalendarSub)+`<div class="cm-calendar-head"><button type="button" class="cursor-interaction" data-month="-1">${t().prev}</button><strong>${t().months[month]} ${year}</strong><button type="button" class="cursor-interaction" data-month="1">${t().next}</button></div><div class="cm-calendar" role="group" aria-label="${t().myShoots}">${days}</div><h3>${dateLabel(selectedDate)}</h3>`+(chosen.length?chosen.map(staffShootCard).join(''):empty(t().staffDateEmpty,'calendar-days'));}

    function resetMedia(){if(mediaDraft.url&&!mediaItems.some(v=>v.url===mediaDraft.url))URL.revokeObjectURL(mediaDraft.url);mediaDraft={title:'',event:'wedding',authorized:false,url:'',filename:''};mediaEditId=null;}

    function mediaAction(b){if(b.hasAttribute('data-media-cancel')){resetMedia();render();return true;}const id=b.dataset.mediaEdit||b.dataset.mediaDelete;if(!id)return false;const item=mediaItems.find(v=>v.id===id);if(!canManageMedia(item)){showNotice(t().staffNoAccess);return true;}if(b.dataset.mediaEdit){resetMedia();mediaDraft={...item};mediaEditId=item.id;view='media';render(true);}else{if(mediaEditId===item.id)resetMedia();mediaItems=mediaItems.filter(v=>v.id!==item.id);URL.revokeObjectURL(item.url);render();showNotice(t().mediaDeleted);}return true;}

      if(b.hasAttribute('data-demo-exit')){beginLogin();return;}
      if(account==='anonymous'||account==='client'){limitedClick(b);return;}
      if(isManager()&&b.dataset.phonePerson&&team.some(p=>p.id===b.dataset.phonePerson)){bindingPerson=b.dataset.phonePerson;bindingPhone=phoneBindings[bindingPerson];view='phoneAccess';render(true);return;}
      if(isManager()&&b.hasAttribute('data-unlink-phone')){phoneBindings[bindingPerson]='';bindingPhone='';render();showNotice(t().phoneRemoved);return;}
      if(!isManager()){staffClick(b);return;}
      if(mediaAction(b))return;
      if(b.dataset.priceMode){priceMode=b.dataset.priceMode;render(true);return;}
      if(b.dataset.priceSection){priceSection=b.dataset.priceSection;render();return;}
      if(b.hasAttribute('data-price-reset')){priceDraft=Object.fromEntries(priceKeys.map(k=>[k,String(rates[k])]));render();showNotice(t().priceReset);return;}
      if(b.dataset.lang){lang=b.dataset.lang;render();return;}
      if(b.dataset.view){view=b.dataset.view;if(view==='calendar'){const next=orders.filter(o=>o.status==='confirmed'&&o.date>=demoToday).sort((a,b)=>a.date.localeCompare(b.date))[0];selectedDate=next?next.date:demoToday;year=Number(selectedDate.slice(0,4));month=Number(selectedDate.slice(5,7))-1;}render(true);return;}
      if(b.dataset.order){openOrder(b.dataset.order);return;}
      if(b.dataset.orderCrew){openOrder(b.dataset.orderCrew);orderTab='crew';render(true);return;}
      if(b.dataset.showDay){selectedDate=b.dataset.showDay;year=Number(selectedDate.slice(0,4));month=Number(selectedDate.slice(5,7))-1;view='calendar';render(true);return;}
      if(b.hasAttribute('data-reschedule-crew')){const o=getOrder();draft=makeDraft(o);draft.date=o.request;orderTab='crew';render(true);return;}
      if(b.dataset.filterLink){filter=b.dataset.filterLink;view='orders';render(true);return;}
      if(b.dataset.orderTab){orderTab=b.dataset.orderTab;render(true);return;}
      if(b.dataset.month){month+=Number(b.dataset.month);if(month<0){month=11;year--;}if(month>11){month=0;year++;}selectedDate=`${year}-${String(month+1).padStart(2,'0')}-01`;render();return;}
      if(b.dataset.date){selectedDate=b.dataset.date;render();return;}
      if(b.dataset.transition){const o=getOrder();if(b.dataset.transition==='confirm'){if(!saveOrder())return;o.status='confirmed';appendHistory(o,'confirmedLog');showNotice(t().confirmedToast);}else if(b.dataset.transition==='editing'){o.status='editing';appendHistory(o,'editingLog');showNotice(t().editingToast);}else if(b.dataset.transition==='ready'){o.status='ready';appendHistory(o,'readyLog');showNotice(t().readyToast);orderTab='messages';}render();return;}
      if(b.dataset.request){const o=getOrder();if(b.dataset.request==='approve'){const conflicts=crewConflicts(o.crew,o.request,o.id);if(conflicts.length){main.querySelector('#cm-request-error').textContent=conflictText(conflicts);return;}o.date=o.request;draft=makeDraft(o);appendHistory(o,'requestLog');showNotice(t().rescheduled);}else{appendHistory(o,'declineLog');showNotice(t().declined);}o.request=null;render();return;}
      if(b.hasAttribute('data-demo-exit'))showNotice(t().demoExit);
    });
    root.addEventListener('input',e=>{const el=e.target;if(isManager()&&el.id==='cm-binding-phone'){bindingPhone=el.value;return;}if(account==='anonymous'){if(el.id==='cm-login-phone')loginState.phone=el.value;if(el.id==='cm-login-code')loginState.code=el.value;return;}if(account==='client')return;if(!isManager()){staffInput(el);return;}if(el.dataset&&el.dataset.price&&priceKeys.includes(el.dataset.price)){priceDraft[el.dataset.price]=el.value;const status=main.querySelector('#cm-price-dirty');if(status)status.textContent=pricesDirty()?t().priceDirty:t().priceClean;const reset=main.querySelector('[data-price-reset]');if(reset)reset.disabled=!pricesDirty();el.removeAttribute('aria-invalid');const error=main.querySelector('#cm-prices-error');if(error)error.textContent='';return;}if(el.id==='cm-video-title')mediaDraft.title=el.value;if(el.id==='cm-order-date'&&draft)draft.date=el.value;if(el.id==='cm-wedding-time'&&draft){draft.weddingTime=el.value;const timeLabel=main.querySelector('#cm-calculated-start');if(timeLabel)timeLabel.textContent=shootTime(draft,getOrder())||t().noTime;}if(el.id==='cm-order-time'&&draft)draft.time=el.value;});
    root.addEventListener('change',e=>{
      const el=e.target;
      if(el.id==='cm-demo-account'){switchAccount(el.value);return;}
      if(account==='anonymous'||account==='client')return;
      if(isManager()&&el.id==='cm-binding-person'&&team.some(p=>p.id===el.value)){bindingPerson=el.value;bindingPhone=phoneBindings[bindingPerson];render();return;}
      if(!isManager()){staffChange(el);return;}
      if(el.name==='crew'){const o=getOrder(),conflicts=el.checked?crewConflicts([el.value],draft.date,o.id):[];if(conflicts.length){el.checked=false;main.querySelector('#cm-crew-error').textContent=conflictText(conflicts);return;}draft.crew=el.checked?Array.from(new Set([...draft.crew,el.value])):draft.crew.filter(id=>id!==el.value);const count=main.querySelector('#cm-crew-count');if(count)count.textContent=t().crewSelected+': '+draft.crew.length+' · '+t().crewFreeCount+': '+team.filter(p=>!busyOrders(p.id,draft.date,o.id).length).length;main.querySelector('#cm-crew-error').textContent='';return;}
      if(el.id==='cm-order-filter'){filter=el.value;render();return;}
      if(el.id==='cm-order-plan'){draft.plan=Number(el.value);render();return;}
      if(el.dataset.extra){const k=el.dataset.extra;draft.extras[k]=k==='foteha'?(el.checked?1:0):el.checked;render();return;}
      if(el.id==='cm-extra-cameras'){draft.extras.foteha=Number(el.value);render();return;}
      if(el.id==='cm-service-cameras'){draft.cameras=Number(el.value);render();return;}
      mediaChange(el);
    });
    root.addEventListener('submit',e=>{
      e.preventDefault();if(account==='anonymous'){submitLogin(e.target.id);return;}if(account==='client')return;if(!isManager()){staffSubmit(e.target.id);return;}if(e.target.id==='cm-phone-binding-form'){savePhoneBinding();return;}const o=getOrder();
      if(e.target.id==='cm-prices-form'){const invalid=priceKeys.filter(k=>!/^\d+$/.test(priceDraft[k])||!Number.isSafeInteger(Number(priceDraft[k]))||Number(priceDraft[k])<1);if(invalid.length){priceSection=packageKeys.includes(invalid[0])?'packages':'extras';render();main.querySelector('#cm-prices-error').textContent=t().priceInvalid;const field=main.querySelector('#cm-price-'+invalid[0]);if(field){field.setAttribute('aria-invalid','true');field.focus();}return;}rates=Object.fromEntries(priceKeys.map(k=>[k,Number(priceDraft[k])]));priceDraft=Object.fromEntries(priceKeys.map(k=>[k,String(rates[k])]));priceUpdatedBy=account;render();showNotice(t().priceSaved);return;}
      if(e.target.id==='cm-details-form'){if(saveOrder()){draft=makeDraft(o);render();showNotice(t().saved);}}
      if(e.target.id==='cm-payment-form'){const value=Number(main.querySelector('#cm-paid').value);if(!Number.isFinite(value)||value<0||value>o.total){main.querySelector('#cm-payment-error').textContent=t().errorPaid;return;}o.paid=value;appendHistory(o,'paidLog');render();showNotice(t().paymentSaved);}
      if(e.target.id==='cm-crew-form'){const selected=Array.from(main.querySelectorAll('input[name="crew"]:checked')).map(el=>el.value);if(!draft.date){main.querySelector('#cm-crew-error').textContent=t().crewDateRequired;return;}if(new Set(selected).size!==selected.length||selected.some(id=>!team.some(p=>p.id===id))){main.querySelector('#cm-crew-error').textContent=t().crewInvalid;return;}const conflicts=crewConflicts(selected,draft.date,o.id);if(conflicts.length){main.querySelector('#cm-crew-error').textContent=conflictText(conflicts);return;}const dateChanged=o.date!==draft.date,requestApproved=dateChanged&&draft.date===o.request;o.date=draft.date;o.crew=[...selected];draft.crew=[...selected];if(requestApproved){o.request=null;appendHistory(o,'requestLog');}else if(dateChanged)appendHistory(o,'savedLog');appendHistory(o,'crewLog');render();showNotice(dateChanged?t().crewSavedDate:t().crewSaved);}
      if(e.target.id==='cm-media-form')publishMedia();
    });
    profileDraft={...profiles[currentPerson().id]};
    bindingPhone=phoneBindings[bindingPerson];
    if(orderId)draft=makeDraft(getOrder());
    render();
    if(typeof ResizeObserver!=='undefined'){const observer=new ResizeObserver(syncChrome);observer.observe(header);observer.observe(footer);const cleanup=setInterval(()=>{if(!document.contains(root)){observer.disconnect();clearInterval(cleanup);clearTimeout(noticeTimer);const urls=new Set([mediaDraft.url,profileDraft?.url,...mediaItems.map(v=>v.url),...Object.values(profiles).map(p=>p.url)]);urls.forEach(url=>{if(url)URL.revokeObjectURL(url);});}},5000);}
  })();
  </script>
</div>
