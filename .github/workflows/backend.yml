name: Application checks
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creative_test
          POSTGRES_USER: creative_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U creative_test -d creative_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TESTING: 'true'
      DATABASE_URL: postgresql://creative_test:ci-only-password@localhost:5432/creative_test
      SECRET_KEY: only-for-isolated-ci-tests-do-not-use-this-value-on-a-live-server-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: python backend/manage.py check --settings=config.test_settings
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python backend/manage.py collectstatic --noinput --settings=config.test_settings
      - run: python backend/manage.py test studio --settings=config.test_settings --verbosity=2
