name: Design preview on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'design/**'
      - 'preview/**'
      - 'scripts/build_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build design preview
        run: python scripts/build_preview.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy design preview
        id: deployment
        uses: actions/deploy-pages@v5
